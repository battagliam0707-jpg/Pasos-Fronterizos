  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .legend-bar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; font-size: 0.8rem;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; }
    .dot-ok { background: var(--ok); box-shadow: 0 0 6px rgba(34, 197, 94, 0.7); }
    .dot-bad { background: var(--bad); box-shadow: 0 0 6px rgba(239, 68, 68, 0.7); }
    .dot-warn { background: var(--warn); box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }
    .controls {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    select, input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; font-size: 0.85rem;
    }
    .kpis { display: flex; gap: 10px; margin-left: auto; font-size: 0.84rem; }
    .kpi { background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; }
    .kpi b { color: var(--accent); }
    .kpi.ok b { color: var(--ok); }
    .kpi.bad b { color: var(--bad); }
    main { display: grid; grid-template-columns: 1.35fr 1fr; flex: 1; min-height: 0; }
    #map { width: 100%; height: 100%; }
    .leaflet-legend {
      background: rgba(15, 23, 42, 0.92); color: #f8fafc;
      border: 1px solid #334155; border-radius: 8px;
      padding: 10px 12px; font-size: 0.8rem; line-height: 1.55;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .leaflet-legend h4 { margin-bottom: 6px; font-size: 0.82rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.03em; }
    .table-wrap { overflow: auto; border-left: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: var(--panel); position: sticky; top: 0; z-index: 2; color: var(--accent); }
    tr:hover { background: rgba(56, 189, 248, 0.08); cursor: pointer; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 0.74rem; }
    .b-ok { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .b-bad { background: rgba(239, 68, 68, 0.18); color: #f87171; }
    .b-warn { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; }
      .kpis { margin-left: 0; }
    }
  </style>
</head>

      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();

    function getCol(row, aliases) {
      if (!row || typeof row !== "object") return "";
      const keys = Object.keys(row);
      for (const alias of aliases) {
        const target = norm(alias);
        const found = keys.find((k) => norm(k) === target);

    function resolverProvincia(provRaw, nombreRaw) {
      const nNom = norm(nombreRaw);
      if (nNom.includes("puerto williams") || nNom.includes("almanza")) return "tierra del fuego";
      if (nNom.includes("colonia cano")) return "formosa";
      const nProv = norm(provRaw);
      if (nProv.includes("tierra del fuego")) return "tierra del fuego";
      if (nProv.includes("caba") || nProv.includes("area metropolitana") || nProv.includes("ciudad autonoma")) return "caba";
      for (const pKey of Object.keys(PERFILES_PROVINCIALES)) {
        if (nProv.includes(pKey)) return pKey;
      }
      for (const item of CATALOGO_AUDITADO) {
        if (nNom.includes(item[0])) return item[1];
      }
      return nProv;
    }

    function desagregar(nombre, lat, lon, usados) {
      const k = `${lat.toFixed(5)},${lon.toFixed(5)}`;
      if (!usados.has(k)) {
        usados.add(k);
        return [Number(lat.toFixed(6)), Number(lon.toFixed(6))];
      }
      const h = [...norm(nombre)].reduce((acc, c) => acc + c.charCodeAt(0), 0);
      const ang = (h % 360) * (Math.PI / 180);
      const r = 0.0022;
      const nLat = Number((lat + r * Math.sin(ang)).toFixed(6));
      const nLon = Number((lon + r * Math.cos(ang)).toFixed(6));
      usados.add(`${nLat.toFixed(5)},${nLon.toFixed(5)}`);
      return [nLat, nLon];
    }

    function clasificarEstado(estadoRaw) {
      const e = norm(estadoRaw);
      if (e.includes("cerrado") || e.includes("inhabilitado") || e.includes("clausurado") || e.includes("suspendido")) {
        return "cerrado";
      }
      if (e.includes("restric") || e.includes("demora") || e.includes("condicional") || e.includes("parcial")) {
        return "restriccion";
      }
      return "habilitado";
    }

    function georreferenciarFila(row, usados) {
      const nombre = getCol(row, ["nombre del paso", "paso", "paso fronterizo", "nombre", "title"]);
      const provRaw = getCol(row, ["provincia", "jurisdiccion", "distrito"]);
      const paisRaw = getCol(row, ["pais limitrofe", "pais", "frontera", "country"]);
      const estadoRaw = getCol(row, ["estado", "situacion", "condicion", "status"]) || "Habilitado";
      const fechaRaw = getCol(row, ["fecha", "fecha reporte", "fecha corte", "date"]) || new Date().toISOString().slice(0, 10);
      const horaRaw = getCol(row, ["hora corte", "hora", "actualizacion", "updated"]);
      const latRaw = parseFloat(getCol(row, ["latitud", "lat", "latitude"]).replace(",", "."));
      const lonRaw = parseFloat(getCol(row, ["longitud", "lon", "lng", "longitude"]).replace(",", "."));

      const nNom = norm(nombre);
      const provCanon = resolverProvincia(provRaw, nombre);

      for (const [clave, provCat, latCat, lonCat, paisCat] of CATALOGO_AUDITADO) {
        if (nNom.includes(clave)) {
          if (!provCanon || provCanon === provCat || (["caba", "buenos aires"].includes(provCanon) && ["caba", "buenos aires"].includes(provCat))) {
            const [lat, lon] = desagregar(nombre, latCat, lonCat, usados);
            return {
              Fecha: fechaRaw,
              HoraCorte: horaRaw,
              Nombre: nombre,
              Provincia: TITULOS_PROVINCIA[provCat] || provRaw || "Sin especificar",
              Pais: paisRaw || paisCat,
              Estado: estadoRaw,
              EstadoTipo: clasificarEstado(estadoRaw),
              Latitud: lat,
              Longitud: lon
            };
          }
        }
      }

      const perfil = PERFILES_PROVINCIALES[provCanon];
      if (!isNaN(latRaw) && !isNaN(lonRaw) && perfil && latRaw >= perfil[0] && latRaw <= perfil[1] && lonRaw >= perfil[2] && lonRaw <= perfil[3]) {
        const [lat, lon] = desagregar(nombre, latRaw, lonRaw, usados);
        return {
          Fecha: fechaRaw,
          HoraCorte: horaRaw,
          Nombre: nombre,
          Provincia: TITULOS_PROVINCIA[provCanon] || provRaw,
          Pais: paisRaw || "Limítrofe",
          Estado: estadoRaw,
          EstadoTipo: clasificarEstado(estadoRaw),
          Latitud: lat,
          Longitud: lon
        };
      }

      const latDef = perfil ? perfil[4] : -34.6037;
      const lonDef = perfil ? perfil[5] : -58.3816;
      const [lat, lon] = desagregar(nombre, latDef, lonDef, usados);
      return {
        Fecha: fechaRaw,
        HoraCorte: horaRaw,
        Nombre: nombre,
        Provincia: TITULOS_PROVINCIA[provCanon] || provRaw || "Sin especificar",
        Pais: paisRaw || "Limítrofe",
        Estado: estadoRaw,
        EstadoTipo: clasificarEstado(estadoRaw),
        Latitud: lat,
        Longitud: lon
      };
    }

    let datasetGlobal = [];

    function poblarFiltros(fuenteEtiqueta) {
      const fechas = [...new Set(datasetGlobal.map((r) => r.Fecha).filter(Boolean))].sort().reverse();
      const selFecha = document.getElementById("selFecha");
      selFecha.innerHTML = "";
      fechas.forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f; opt.textContent = "Fecha: " + f;
        selFecha.appendChild(opt);
      });

      const provincias = [...new Set(datasetGlobal.map((r) => r.Provincia).filter(Boolean))].sort();
      const selProv = document.getElementById("selProvincia");
      selProv.innerHTML = '<option value="">Todas las provincias</option>';
      provincias.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        selProv.appendChild(opt);
      });

      const paises = [...new Set(datasetGlobal.map((r) => r.Pais).filter(Boolean))].sort();
      const selPais = document.getElementById("selPais");
      selPais.innerHTML = '<option value="">Todos los países</option>';
      paises.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        selPais.appendChild(opt);
      });

      const ultimo = datasetGlobal.find((r) => r.Fecha === fechas[0]);
      document.getElementById("lblCorte").textContent =
        `Fuente: ${fuenteEtiqueta} · Último corte: ${(ultimo && (ultimo.HoraCorte || ultimo.Fecha)) || "Actualizado"}`;
    }

    function renderizar() {
      const fechaSel = document.getElementById("selFecha").value;
      const provSel = document.getElementById("selProvincia").value;
      const paisSel = document.getElementById("selPais").value;
      const estSel = document.getElementById("selEstado").value;
      const q = norm(document.getElementById("txtBuscar").value);

      const filtrados = datasetGlobal.filter((r) => {
        if (fechaSel && r.Fecha !== fechaSel) return false;
        if (provSel && r.Provincia !== provSel) return false;
        if (paisSel && r.Pais !== paisSel) return false;
        if (estSel && r.EstadoTipo !== estSel) return false;
        if (q && !norm(r.Nombre).includes(q) && !norm(r.Provincia).includes(q)) return false;
        return true;
      });

      markersLayer.clearLayers();
      const tbody = document.getElementById("tbodyPasos");
      tbody.innerHTML = "";

      let hab = 0, cer = 0;
      const bounds = [];

      filtrados.forEach((r) => {
        if (r.EstadoTipo === "cerrado") cer++; else hab++;

        const color = r.EstadoTipo === "cerrado" ? "#ef4444" : (r.EstadoTipo === "restriccion" ? "#f59e0b" : "#22c55e");
        const badgeCls = r.EstadoTipo === "cerrado" ? "b-bad" : (r.EstadoTipo === "restriccion" ? "b-warn" : "b-ok");
        const dotCls = r.EstadoTipo === "cerrado" ? "dot-bad" : (r.EstadoTipo === "restriccion" ? "dot-warn" : "dot-ok");

        const marker = L.circleMarker([r.Latitud, r.Longitud], {
          radius: 7, fillColor: color, color: "#ffffff", weight: 1.5, fillOpacity: 0.92
        }).bindPopup(`
          <b>${r.Nombre}</b><br/>
          Provincia: ${r.Provincia}<br/>
          País: ${r.Pais}<br/>
          Estado: <b>${r.Estado}</b><br/>
          Coord: ${r.Latitud}, ${r.Longitud}
        `);
        marker.addTo(markersLayer);
        bounds.push([r.Latitud, r.Longitud]);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>${r.Nombre}</b></td>
          <td>${r.Provincia}</td>
          <td>${r.Pais}</td>
          <td><span class="badge ${badgeCls}"><span class="dot ${dotCls}" style="width:8px;height:8px;border:none;"></span>${r.Estado}</span></td>
          <td>${r.Latitud}, ${r.Longitud}</td>
        `;
        tr.onclick = () => {
          map.setView([r.Latitud, r.Longitud], 11);
          marker.openPopup();
        };
        tbody.appendChild(tr);
      });

      document.getElementById("kpiTotal").textContent = filtrados.length;
      document.getElementById("kpiHab").textContent = hab;
      document.getElementById("kpiCer").textContent = cer;

      if (bounds.length > 0 && (provSel || paisSel || q)) {
        map.fitBounds(bounds, { padding: [35, 35], maxZoom: 9 });
      }
    }

    function cargarDesdeFilas(rawRows, fuenteEtiqueta) {
      const usadosPorFecha = {};
      const validos = rawRows
        .filter((r) => {
          const nom = getCol(r, ["nombre del paso", "paso", "paso fronterizo", "nombre", "title"]);
          return nom && !esPasoIgnorado(nom);
        })
        .map((r) => {
          const f = getCol(r, ["fecha", "fecha reporte", "fecha corte", "date"]) || new Date().toISOString().slice(0, 10);
          if (!usadosPorFecha[f]) usadosPorFecha[f] = new Set();
          return georreferenciarFila(r, usadosPorFecha[f]);
        });

      if (validos.length === 0) return false;
      datasetGlobal = validos;
      poblarFiltros(fuenteEtiqueta);
      renderizar();
      return true;
    }

    function cargarCatalogoRespaldo() {
      const hoy = new Date().toISOString().slice(0, 10);
      const cerradosConocidos = ["puerto williams", "san francisco", "pircas negras", "agua negra", "sico", "socompa"];
      const filas = CATALOGO_AUDITADO.map(([, prov, lat, lon, pais, nombre]) => {
        const esCer = cerradosConocidos.some((c) => norm(nombre).includes(c));
        return {
          "Fecha": hoy,
          "Hora Corte": hoy + " (Catálogo Auditado)",
          "Nombre del Paso": nombre,
          "Provincia": TITULOS_PROVINCIA[prov] || prov,
          "País Limítrofe": pais,
          "Estado": esCer ? "Cerrado" : "Habilitado",
          "Latitud": lat,
          "Longitud": lon
        };
      });
      cargarDesdeFilas(filas, "Catálogo Maestro Auditado");
    }

    const FUENTES_CSV = [
      { url: "consolidado_pasos_2026.csv", label: "Consolidado Diario 2026" },
      { url: "historico_diario_2026.csv", label: "Histórico Diario 2026" },
      { url: "maestro_pasos.csv", label: "Maestro de Pasos" }
    ];

    function intentarSiguienteCSV(idx) {
      if (idx >= FUENTES_CSV.length) {
        cargarCatalogoRespaldo();
        return;
      }
      const fuente = FUENTES_CSV[idx];
      Papa.parse(`${fuente.url}?v=${Date.now()}`, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (res) => {
          if (!res || !res.data || !cargarDesdeFilas(res.data, fuente.label)) {
            intentarSiguienteCSV(idx + 1);
          }
        },
        error: () => intentarSiguienteCSV(idx + 1)
      });
    }

    ["selFecha", "selProvincia", "selPais", "selEstado"].forEach((id) =>
      document.getElementById(id).addEventListener("change", renderizar)
    );
    document.getElementById("txtBuscar").addEventListener("input", renderizar);

    intentarSiguienteCSV(0);
  </script>
</body>
</html>
